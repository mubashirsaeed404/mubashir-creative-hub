<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Enhancer - Mubashir Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f11; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-red { background: #e11d48; color: #ffffff; font-weight: 600; }
        .btn-red:hover { background: #be123c; }
        .loader { border-top-color: #e11d48; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-bold tracking-wide text-rose-500">MUBASHIR PHOTO STUDIO</h1>
            </div>
            <span class="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-full font-medium">✨ Auto HD Photo Enhancer</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col items-center">
        
        <h2 class="text-3xl font-extrabold text-white mb-6 text-center">Photo Enhancer</h2>

        <!-- Upload Box -->
        <div class="w-full max-w-xl bg-zinc-900 border-2 border-dashed border-zinc-700 hover:border-rose-500 rounded-2xl p-6 text-center transition mb-8 shadow-xl">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <label for="imageInput" class="btn-red py-3.5 px-8 rounded-xl flex items-center justify-center gap-3 cursor-pointer text-base shadow-lg mx-auto w-max">
                <i class="fa-solid fa-upload"></i> Upload Image
            </label>
            <p class="text-xs text-zinc-400 mt-3">Select any photo to automatically enhance quality & detail</p>
        </div>

        <!-- Processing Loader -->
        <div id="loadingState" class="hidden my-8 text-center space-y-3">
            <div class="loader ease-linear rounded-full border-4 border-zinc-800 h-10 w-10 mx-auto"></div>
            <p class="text-sm font-medium text-rose-400">Enhancing Image Quality & Sharpness...</p>
        </div>

        <!-- Comparison Section (Side-by-Side) -->
        <div id="resultContainer" class="hidden w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 gap-8 items-start my-4">
            
            <!-- Left: Original Image -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col items-center shadow-lg">
                <span class="text-sm font-bold text-zinc-400 uppercase tracking-wider mb-3">Original</span>
                <div class="w-full aspect-square bg-zinc-950 rounded-xl overflow-hidden flex items-center justify-center border border-zinc-800">
                    <img id="originalImg" class="max-h-full max-w-full object-contain rounded-lg" alt="Original Photo">
                </div>
            </div>

            <!-- Right: Auto HD Enhanced Image -->
            <div class="bg-zinc-900 border border-rose-500/30 rounded-2xl p-4 flex flex-col items-center shadow-2xl relative">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-sm font-bold text-rose-500 uppercase tracking-wider">Enhanced HD Quality</span>
                    <span class="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full font-bold">Auto 4K</span>
                </div>

                <div class="w-full aspect-square bg-zinc-950 rounded-xl overflow-hidden flex items-center justify-center border border-zinc-800 mb-4">
                    <canvas id="enhancedCanvas" class="max-h-full max-w-full object-contain rounded-lg"></canvas>
                </div>

                <!-- Download Buttons -->
                <div class="w-full space-y-2">
                    <button onclick="downloadImage('hd')" class="w-full btn-red py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold shadow-lg transition">
                        <i class="fa-solid fa-download"></i> Download HD Image
                    </button>
                    <button onclick="downloadImage('full')" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 py-2.5 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold transition border border-zinc-700">
                        <i class="fa-solid fa-file-image"></i> Download Full Resolution
                    </button>
                </div>
            </div>

        </div>

    </main>

    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        © 2026 Mubashir Creative Hub & Photo Studio. All Rights Reserved.
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const originalImg = document.getElementById('originalImg');
        const enhancedCanvas = document.getElementById('enhancedCanvas');
        const ctx = enhancedCanvas.getContext('2d');
        const loadingState = document.getElementById('loadingState');
        const resultContainer = document.getElementById('resultContainer');

        let currentImage = null;

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loadingState.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                currentImage = new Image();
                currentImage.onload = function() {
                    // Display Original
                    originalImg.src = event.target.result;

                    // Auto Enhance Process
                    setTimeout(() => {
                        autoEnhancePhoto();
                        loadingState.classList.add('hidden');
                        resultContainer.classList.remove('hidden');
                    }, 400);
                };
                currentImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function autoEnhancePhoto() {
            enhancedCanvas.width = currentImage.width;
            enhancedCanvas.height = currentImage.height;

            // 1. Automatic Clarity, Brightness & Contrast Adjustment
            ctx.clearRect(0, 0, enhancedCanvas.width, enhancedCanvas.height);
            ctx.filter = 'brightness(108%) contrast(112%) saturate(106%)';
            ctx.drawImage(currentImage, 0, 0, enhancedCanvas.width, enhancedCanvas.height);

            // 2. Convolution Matrix for Auto HD Sharpness Edge Detection
            applySharpnessMatrix(enhancedCanvas.width, enhancedCanvas.height);
        }

        function applySharpnessMatrix(w, h) {
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const copy = new Uint8ClampedArray(data);

            // Unsharp Mask Kernel
            const weight = 0.35;
            const kernel = [
                0, -weight, 0,
                -weight, 1 + (4 * weight), -weight,
                0, -weight, 0
            ];

            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let i = (y * w + x) * 4 + c;
                        let val = 
                            copy[((y - 1) * w + (x - 1)) * 4 + c] * kernel[0] +
                            copy[((y - 1) * w + x) * 4 + c] * kernel[1] +
                            copy[((y - 1) * w + (x + 1)) * 4 + c] * kernel[2] +
                            copy[(y * w + (x - 1)) * 4 + c] * kernel[3] +
                            copy[i] * kernel[4] +
                            copy[(y * w + (x + 1)) * 4 + c] * kernel[5] +
                            copy[((y + 1) * w + (x - 1)) * 4 + c] * kernel[6] +
                            copy[((y + 1) * w + x) * 4 + c] * kernel[7] +
                            copy[((y + 1) * w + (x + 1)) * 4 + c] * kernel[8];
                        
                        data[i] = Math.min(255, Math.max(0, val));
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function downloadImage(type) {
            if (!currentImage) return;
            const link = document.createElement('a');
            link.download = `mubashir-studio-hd-enhanced.png`;
            link.href = enhancedCanvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
