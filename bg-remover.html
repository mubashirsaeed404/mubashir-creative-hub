<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe AI Background Remover</title>
    <!-- MediaPipe Selfie Segmentation AI -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        :root { --bg: #0f0f11; --card: #18181b; --accent: #eab308; --text: #f4f4f5; --border: #27272a; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
        header { background: #000; padding: 1.2rem; text-align: center; border-bottom: 2px solid var(--accent); }
        header h1 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .back-link { display: inline-block; color: var(--accent); text-decoration: none; font-weight: bold; margin-bottom: 1rem; }
        .upload-area { border: 2px dashed var(--accent); background: #1a1a1e; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; }
        .color-presets { display: flex; gap: 10px; margin: 1.5rem 0; flex-wrap: wrap; align-items: center; }
        .color-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .preview-box { background: #000; border: 1px solid var(--border); border-radius: 10px; min-height: 300px; display: flex; align-items: center; justify-content: center; margin-top: 1.5rem; overflow: hidden; }
        canvas { max-width: 100%; height: auto; }
        #status { color: var(--accent); font-weight: bold; margin-top: 10px; text-align: center; }
        .dl-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 1.5rem; }
        .slider-box { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<header>
    <h1>AI Passport Studio Editor</h1>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Main Hub</a>

    <div class="upload-area" onclick="document.getElementById('file-in').click()">
        <h3>📁 Upload Image (JPG / PNG)</h3>
        <p style="color:#a1a1aa; margin:0;">Click to select photo for HD Google MediaPipe AI Cutout</p>
        <input type="file" id="file-in" accept="image/*" style="display:none" onchange="processImage(event)">
    </div>

    <div id="status">⏳ Initializing MediaPipe AI...</div>

    <div class="color-presets">
        <label style="font-weight:bold;">Select Background Color:</label>
        <div class="color-btn" style="background:#0055ff;" onclick="changeBg('#0055ff')"></div>
        <div class="color-btn" style="background:#ffffff;" onclick="changeBg('#ffffff')"></div>
        <div class="color-btn" style="background:#cc0000;" onclick="changeBg('#cc0000')"></div>
        <div class="color-btn" style="background:#888888;" onclick="changeBg('#888888')"></div>
        <input type="color" id="custom-color" value="#cc0000" onchange="changeBg(this.value)">
    </div>

    <div class="slider-box">
        <label style="font-weight:bold;">Edge Cut Softness / Trim:</label>
        <input type="range" id="edgeThreshold" min="0.3" max="0.9" step="0.05" value="0.65" oninput="reRender()">
    </div>

    <div class="preview-box">
        <canvas id="out-canvas"></canvas>
    </div>

    <button class="dl-btn" onclick="downloadPhoto()">Download Passport Photo</button>
</div>

<script>
    let currentColor = '#cc0000';
    let loadedImage = null;
    let selfieSegmentation = null;
    let lastResults = null;

    // Load Google MediaPipe Model
    function initMediaPipe() {
        selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({
            modelSelection: 1 // 1 = High-accuracy portrait model
        });

        selfieSegmentation.onResults(onResults);
        document.getElementById('status').innerText = "✅ MediaPipe AI Engine Ready! Upload Photo.";
    }

    initMediaPipe();

    function processImage(e) {
        let file = e.target.files[0];
        if(!file) return;

        let status = document.getElementById('status');
        status.innerText = "🔍 Precision AI is scanning subject & removing background...";

        let reader = new FileReader();
        reader.onload = function(event) {
            let img = new Image();
            img.onload = async function() {
                loadedImage = img;
                await selfieSegmentation.send({ image: loadedImage });
                status.innerText = "✅ Studio Cutout Finished!";
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function onResults(results) {
        lastResults = results;
        renderCanvas();
    }

    function renderCanvas() {
        if(!lastResults || !loadedImage) return;

        let canvas = document.getElementById('out-canvas');
        let ctx = canvas.getContext('2d');
        canvas.width = loadedImage.width;
        canvas.height = loadedImage.height;

        let thresh = parseFloat(document.getElementById('edgeThreshold').value);

        // 1. Fill solid background color
        ctx.save();
        ctx.fillStyle = currentColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Process segmentation mask with precision thresholding
        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        let tempCtx = tempCanvas.getContext('2d');

        tempCtx.drawImage(lastResults.segmentationMask, 0, 0, canvas.width, canvas.height);
        let maskData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
        let pixels = maskData.data;

        // Apply strict threshold to eliminate white outline bleed
        for (let i = 0; i < pixels.length; i += 4) {
            let alpha = pixels[i] / 255.0;
            if (alpha < thresh) {
                pixels[i + 3] = 0; // Cut background fully
            } else {
                pixels[i + 3] = 255;
            }
        }
        tempCtx.putImageData(maskData, 0, 0);

        // 3. Composite subject onto clean background
        tempCtx.globalCompositeOperation = 'source-in';
        tempCtx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

        ctx.drawImage(tempCanvas, 0, 0);
        ctx.restore();
    }

    function reRender() {
        renderCanvas();
    }

    function changeBg(color) {
        currentColor = color;
        renderCanvas();
    }

    function downloadPhoto() {
        let canvas = document.getElementById('out-canvas');
        if(canvas.width === 0) return alert("Please upload an image first.");
        let a = document.createElement('a');
        a.download = 'studio_passport_photo.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }
</script>

</body>
</html>
