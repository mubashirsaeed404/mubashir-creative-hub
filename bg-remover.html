<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Background Remover</title>
    <!-- TensorFlow & BodyPix AI Models -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>

    <style>
        :root { --bg: #0f0f11; --card: #18181b; --accent: #eab308; --text: #f4f4f5; --border: #27272a; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
        header { background: #000; padding: 1.2rem; text-align: center; border-bottom: 2px solid var(--accent); }
        header h1 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .back-link { display: inline-block; color: var(--accent); text-decoration: none; font-weight: bold; margin-bottom: 1rem; }
        .upload-area { border: 2px dashed var(--accent); background: #1a1a1e; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; }
        .color-presets { display: flex; gap: 10px; margin: 1.5rem 0; flex-wrap: wrap; align-items: center; }
        .color-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .preview-box { background: #000; border: 1px solid var(--border); border-radius: 10px; min-height: 300px; display: flex; align-items: center; justify-content: center; margin-top: 1.5rem; overflow: hidden; }
        canvas { max-width: 100%; height: auto; }
        #status { color: var(--accent); font-weight: bold; margin-top: 10px; text-align: center; }
        .dl-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 1.5rem; }
    </style>
</head>
<body>

<header>
    <h1>AI Passport Studio Editor</h1>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Main Hub</a>

    <div class="upload-area" onclick="document.getElementById('file-in').click()">
        <h3>📁 Upload Image (JPG / PNG)</h3>
        <p style="color:#a1a1aa; margin:0;">Click to select photo for Automatic AI Object Detection</p>
        <input type="file" id="file-in" accept="image/*" style="display:none" onchange="processImage(event)">
    </div>

    <div id="status">⏳ Loading AI Model, please wait...</div>

    <div class="color-presets">
        <label style="font-weight:bold;">Select Background Color:</label>
        <div class="color-btn" style="background:#0055ff;" onclick="changeBg('#0055ff')"></div>
        <div class="color-btn" style="background:#ffffff;" onclick="changeBg('#ffffff')"></div>
        <div class="color-btn" style="background:#cc0000;" onclick="changeBg('#cc0000')"></div>
        <div class="color-btn" style="background:#888888;" onclick="changeBg('#888888')"></div>
        <input type="color" id="custom-color" value="#0055ff" onchange="changeBg(this.value)">
    </div>

    <div class="preview-box">
        <canvas id="out-canvas"></canvas>
    </div>

    <button class="dl-btn" onclick="downloadPhoto()">Download Passport Photo</button>
</div>

<script>
    let net = null;
    let originalImg = null;
    let currentColor = '#0055ff';

    // Initialize TensorFlow BodyPix Model
    async function loadModel() {
        let status = document.getElementById('status');
        status.innerText = "⏳ Loading AI Engine... (First time may take a few seconds)";
        net = await bodyPix.load({
            architecture: 'MobileNetV1',
            outputStride: 16,
            multiplier: 0.75,
            quantBytes: 2
        });
        status.innerText = "✅ AI Engine Ready! Please Upload Photo.";
    }
    loadModel();

    async function processImage(e) {
        let file = e.target.files[0];
        if(!file) return;

        if(!net) {
            alert("AI Model is still loading, please wait a moment.");
            return;
        }

        let status = document.getElementById('status');
        status.innerText = "🔍 AI is detecting person & cutting background...";

        let reader = new FileReader();
        reader.onload = function(event) {
            let img = new Image();
            img.onload = async function() {
                originalImg = img;
                await runSegmentation();
                status.innerText = "✅ Background Removed Successfully!";
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function runSegmentation() {
        if(!originalImg || !net) return;

        let canvas = document.getElementById('out-canvas');
        let ctx = canvas.getContext('2d');
        canvas.width = originalImg.width;
        canvas.height = originalImg.height;

        // Perform AI Person Detection
        const segmentation = await net.segmentPerson(originalImg, {
            internalResolution: 'medium',
            segmentationThreshold: 0.7
        });

        // Draw Selected Studio Background
        ctx.fillStyle = currentColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Get Image Pixels
        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        let tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(originalImg, 0, 0);

        let imgData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
        let pixels = imgData.data;

        // Apply AI Mask: Keep person pixels, remove background
        for (let i = 0; i < segmentation.data.length; i++) {
            if (segmentation.data[i] === 0) {
                // Background pixel -> make transparent
                pixels[i * 4 + 3] = 0;
            }
        }

        tempCtx.putImageData(imgData, 0, 0);
        ctx.drawImage(tempCanvas, 0, 0);
    }

    function changeBg(color) {
        currentColor = color;
        runSegmentation();
    }

    function downloadPhoto() {
        let canvas = document.getElementById('out-canvas');
        if(canvas.width === 0) return alert("Please upload an image first.");
        let a = document.createElement('a');
        a.download = 'passport_studio_photo.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }
</script>

</body>
</html>
