<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Passport Studio Editor</title>
    <style>
        :root { --bg: #0f0f11; --card: #18181b; --accent: #eab308; --text: #f4f4f5; --border: #27272a; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
        header { background: #000; padding: 1.2rem; text-align: center; border-bottom: 2px solid var(--accent); }
        header h1 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .back-link { display: inline-block; color: var(--accent); text-decoration: none; font-weight: bold; margin-bottom: 1rem; }
        .upload-area { border: 2px dashed var(--accent); background: #1a1a1e; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; }
        .color-presets { display: flex; gap: 10px; margin: 1.5rem 0; flex-wrap: wrap; align-items: center; }
        .color-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .preview-box { background: #000; border: 1px solid var(--border); border-radius: 10px; min-height: 300px; display: flex; align-items: center; justify-content: center; margin-top: 1.5rem; overflow: hidden; padding: 10px; }
        canvas { max-width: 100%; height: auto; cursor: crosshair; }
        #status { color: var(--accent); font-weight: bold; margin-top: 10px; text-align: center; }
        .dl-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 1.5rem; }
        .tool-bar { background: #1a1a1e; padding: 10px; border-radius: 8px; margin-top: 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>

<header>
    <h1>AI Passport Studio Editor</h1>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Main Hub</a>

    <div class="upload-area" onclick="document.getElementById('file-in').click()">
        <h3>📁 Upload Image (JPG / PNG)</h3>
        <p style="color:#a1a1aa; margin:0;">Click to select photo (Offline Local Canvas Studio Engine)</p>
        <input type="file" id="file-in" accept="image/*" style="display:none" onchange="loadImage(event)">
    </div>

    <div id="status"></div>

    <div class="tool-bar">
        <div>
            <label style="font-size:0.9rem; font-weight:bold;">Click Photo Corner to Remove BG Color</label>
        </div>
        <div>
            <button onclick="resetImage()" style="background:#27272a; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Reset Photo</button>
        </div>
    </div>

    <div class="color-presets">
        <label style="font-weight:bold;">Select New Background Color:</label>
        <div class="color-btn" style="background:#0055ff;" onclick="changeBg('#0055ff')"></div>
        <div class="color-btn" style="background:#ffffff;" onclick="changeBg('#ffffff')"></div>
        <div class="color-btn" style="background:#cc0000;" onclick="changeBg('#cc0000')"></div>
        <div class="color-btn" style="background:#888888;" onclick="changeBg('#888888')"></div>
        <input type="color" id="custom-color" value="#0055ff" onchange="changeBg(this.value)">
    </div>

    <div class="preview-box">
        <canvas id="out-canvas" onclick="pickAndRemoveBg(event)"></canvas>
    </div>

    <button class="dl-btn" onclick="downloadPhoto()">Download Passport Photo</button>
</div>

<script>
    let rawImg = new Image();
    let bgMaskCanvas = document.createElement('canvas');
    let currentColor = '#0055ff';
    let isProcessed = false;

    function loadImage(e) {
        let file = e.target.files[0];
        if(!file) return;

        let reader = new FileReader();
        reader.onload = function(event) {
            rawImg.onload = function() {
                let canvas = document.getElementById('out-canvas');
                let ctx = canvas.getContext('2d');
                canvas.width = rawImg.width;
                canvas.height = rawImg.height;
                
                bgMaskCanvas.width = rawImg.width;
                bgMaskCanvas.height = rawImg.height;

                // Auto Clean Top Corner Background on Upload
                autoRemoveCornerBg();
                document.getElementById('status').innerText = "✅ Image Loaded! Tap anywhere on background to refine cutout if needed.";
            };
            rawImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function autoRemoveCornerBg() {
        let canvas = document.getElementById('out-canvas');
        let ctx = canvas.getContext('2d');
        ctx.drawImage(rawImg, 0, 0);

        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;

        // Sample top-left corner background color
        let targetR = data[0], targetG = data[1], targetB = data[2];
        let newRGB = hexToRgb(currentColor);

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let dist = Math.sqrt((r-targetR)**2 + (g-targetG)**2 + (b-targetB)**2);
            
            if (dist < 45) { // Color match threshold
                data[i] = newRGB.r;
                data[i+1] = newRGB.g;
                data[i+2] = newRGB.b;
            }
        }
        ctx.putImageData(imgData, 0, 0);
        isProcessed = true;
    }

    function pickAndRemoveBg(e) {
        if(!rawImg.src) return;
        let canvas = document.getElementById('out-canvas');
        let ctx = canvas.getContext('2d');
        let rect = canvas.getBoundingClientRect();
        
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        
        let x = Math.floor((e.clientX - rect.left) * scaleX);
        let y = Math.floor((e.clientY - rect.top) * scaleY);

        ctx.drawImage(rawImg, 0, 0);
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;

        let pixelIdx = (y * canvas.width + x) * 4;
        let targetR = data[pixelIdx], targetG = data[pixelIdx+1], targetB = data[pixelIdx+2];
        let newRGB = hexToRgb(currentColor);

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let dist = Math.sqrt((r-targetR)**2 + (g-targetG)**2 + (b-targetB)**2);
            
            if (dist < 50) {
                data[i] = newRGB.r;
                data[i+1] = newRGB.g;
                data[i+2] = newRGB.b;
            }
        }
        ctx.putImageData(imgData, 0, 0);
        document.getElementById('status').innerText = "✅ Background color updated!";
    }

    function changeBg(color) {
        currentColor = color;
        if(rawImg.src) autoRemoveCornerBg();
    }

    function resetImage() {
        if(!rawImg.src) return;
        let canvas = document.getElementById('out-canvas');
        let ctx = canvas.getContext('2d');
        ctx.drawImage(rawImg, 0, 0);
        document.getElementById('status').innerText = "Photo reset to original.";
    }

    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 85, b: 255 };
    }

    function downloadPhoto() {
        let canvas = document.getElementById('out-canvas');
        if(canvas.width === 0) return alert("Please upload an image first.");
        let a = document.createElement('a');
        a.download = 'passport_studio_photo.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }
</script>

</body>
</html>
