<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Passport Studio Editor - Pakistan</title>
    <style>
        :root { --bg: #1e1e1e; --card: #2d2d2d; --accent: #00b0ff; --text: #fafafa; --border: #3d3d3d; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
        header { background: #000; padding: 1.2rem; text-align: center; border-bottom: 2px solid var(--accent); }
        header h1 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .back-link { display: inline-block; color: var(--accent); text-decoration: none; font-weight: bold; margin-bottom: 1rem; }
        .upload-area { border: 2px dashed var(--accent); background: #252525; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; }
        .color-presets { display: flex; gap: 10px; margin: 1.5rem 0; flex-wrap: wrap; align-items: center; justify-content: center; }
        .color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .preview-box { background: #000; border: 1px solid var(--border); border-radius: 10px; min-height: 300px; display: flex; align-items: center; justify-content: center; margin-top: 1.5rem; overflow: hidden; padding: 10px; }
        canvas { max-width: 100%; height: auto; }
        #status { color: var(--accent); font-weight: bold; margin-top: 10px; text-align: center; }
        .dl-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1.5rem; font-size: 1rem; }
    </style>
</head>
<body>

    <header>
        <h1>AI Passport Studio Editor</h1>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Main Hub</a>

        <div class="upload-area" onclick="document.getElementById('file-in').click()">
            <h3>Upload Image (JPG / PNG)</h3>
            <p style="color:#aaa; margin:0;">Click to select photo</p>
            <input type="file" id="file-in" accept="image/*" style="display:none" onchange="processImage(event)">
        </div>

        <div id="status"></div>

        <div class="color-presets">
            <span>Background Color:</span>
            <div class="color-btn" style="background: #ffffff;" onclick="changeBg('#ffffff')"></div>
            <div class="color-btn" style="background: #00a2ff;" onclick="changeBg('#00a2ff')"></div>
            <div class="color-btn" style="background: #003399;" onclick="changeBg('#003399')"></div>
            <div class="color-btn" style="background: #ff0000;" onclick="changeBg('#ff0000')"></div>
            <input type="color" id="custom-color" onchange="changeBg(this.value)" style="width: 35px; height: 35px; border:none; cursor:pointer;">
        </div>

        <div class="preview-box">
            <canvas id="out-canvas"></canvas>
        </div>

        <button class="dl-btn" onclick="downloadPhoto()">Download Photo</button>
    </div>

    <script>
        const canvas = document.getElementById('out-canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        let cutImg = new Image();
        let currentColor = '#ffffff';

        async function processImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            status.innerText = "Removing Background... Please wait...";

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('https://mubashir-creative-hub.vercel.app/remove-bg', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Processing failed");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                cutImg.onload = () => {
                    canvas.width = cutImg.width;
                    canvas.height = cutImg.height;
                    renderCanvas();
                    status.innerText = "Background Removed Successfully!";
                };
                cutImg.src = url;

            } catch (err) {
                console.error(err);
                status.innerText = "Error removing background. Please try again.";
            }
        }

        function changeBg(color) {
            currentColor = color;
            renderCanvas();
        }

        function renderCanvas() {
            if (!cutImg.src) return;
            ctx.fillStyle = currentColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(cutImg, 0, 0);
        }

        function downloadPhoto() {
            if (canvas.width === 0) return alert("Please upload an image first.");
            const a = document.createElement('a');
            a.download = 'passport_studio_photo.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }
    </script>
</body>
</html>
