<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Passport Suit Editor - Mubashir Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f11; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 600; }
        .btn-gold:hover { background: linear-gradient(135deg, #fde047 0%, #eab308 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-bold tracking-wide text-yellow-500">MUBASHIR PHOTO STUDIO</h1>
            </div>
            <span class="text-xs bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 px-3 py-1 rounded-full font-medium">👔 Local Suit Fit (ID Safe)</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-yellow-500"></i> 1. Upload Photo
                </h2>
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="w-full btn-gold py-3 px-4 rounded-lg flex items-center justify-center gap-2 cursor-pointer shadow-lg">
                    <i class="fa-solid fa-image"></i> Upload Reference Photo
                </label>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-tie text-yellow-500"></i> 2. Select Suit Style
                </h2>
                <div class="grid grid-cols-2 gap-3" id="suitGrid">
                    <!-- Suits will be added by JS -->
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-yellow-500"></i> 3. Background Color
                </h2>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="changeBg('#ffffff')" class="p-4 border-2 border-zinc-700 bg-white rounded"></button>
                    <button onclick="changeBg('#0055ff')" class="p-4 border-2 border-zinc-700 bg-blue-600 rounded"></button>
                    <button onclick="changeBg('#a1a1aa')" class="p-4 border-2 border-zinc-700 bg-zinc-400 rounded"></button>
                    <button onclick="changeBg('#dc2626')" class="p-4 border-2 border-zinc-700 bg-red-600 rounded"></button>
                </div>
            </div>

            <button onclick="downloadPassportPhoto()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-base shadow-xl transition">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Finalize ID Safe Passport Photo
            </button>

        </div>

        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-2xl relative">
                <canvas id="studioCanvas" width="413" height="531" class="rounded max-w-full h-auto cursor-pointer" title="Use controls above"></canvas>
            </div>
            <div class="max-w-[413px] w-full mt-4 space-y-3">
                <div class="flex items-center gap-3">
                    <label class="text-xs text-zinc-400">Position Up/Down</label>
                    <input type="range" id="posYSlider" min="-100" max="100" value="0" class="flex-grow accent-yellow-500" oninput="drawCanvas()">
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-xs text-zinc-400">Suit Size</label>
                    <input type="range" id="scaleSlider" min="50" max="150" value="100" class="flex-grow accent-yellow-500" oninput="drawCanvas()">
                </div>
            </div>
        </div>

    </main>

    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        © 2026 Mubashir Creative Hub & Photo Studio. All Rights Reserved.
    </footer>

    <script>
        const canvas = document.getElementById('studioCanvas');
        const ctx = canvas.getContext('2d');
        const posYSlider = document.getElementById('posYSlider');
        const scaleSlider = document.getElementById('scaleSlider');

        let userImg = null;
        let suitImg = new Image();
        suitImg.crossOrigin = 'Anonymous';
        let bgColor = '#ffffff';

        // High Quality PNG transparent suits (Studio Grade)
        const suits = [
            { name: 'Black Suit & Red Tie', url: 'https://images.rawpixel.com/image_png_800/2022/10/rawpixel-item-12002345-png.png' },
            { name: 'Navy Blue Suit', url: 'https://images.rawpixel.com/image_png_800/2022/10/rawpixel-item-12002342-png.png' },
            { name: 'Formal Gray Vest', url: 'https://images.rawpixel.com/image_png_800/2022/10/rawpixel-item-12002334-png.png' },
            { name: 'Executive Tuxedo', url: 'https://images.rawpixel.com/image_png_800/2022/10/rawpixel-item-12002324-png.png' }
        ];

        // Load Suit Grid
        const suitGrid = document.getElementById('suitGrid');
        suits.forEach((suit, index) => {
            const card = document.createElement('div');
            card.className = `border-2 border-zinc-700 bg-zinc-800 p-2 rounded-lg cursor-pointer text-center ${index===0 ? 'border-yellow-500' : ''}`;
            card.id = `suit-${index}`;
            card.innerHTML = `<img src="${suit.url}" class="h-16 object-contain mx-auto mb-1"><span class="text-[10px] text-zinc-400 font-medium">${suit.name}</span>`;
            card.onclick = () => selectSuit(index);
            suitGrid.appendChild(card);
        });

        // Load Default Suit
        suitImg.onload = () => drawCanvas();
        suitImg.src = suits[0].url;

        function selectSuit(index) {
            document.querySelectorAll('#suitGrid > div').forEach(d => d.classList.remove('border-yellow-500'));
            document.getElementById(`suit-${index}`).classList.add('border-yellow-500');
            suitImg.src = suits[index].url;
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImg = new Image();
                    userImg.onload = () => drawCanvas();
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function changeBg(color) {
            bgColor = color;
            drawCanvas();
        }

        function drawCanvas() {
            // Fill Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw user photo
            if (userImg) {
                const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
                const x = (canvas.width / 2) - (userImg.width / 2) * scale;
                const y = (canvas.height / 2) - (userImg.height / 2) * scale;
                ctx.drawImage(userImg, x, y, userImg.width * scale, userImg.height * scale);
            }

            // Draw transparent suit
            if (suitImg.complete && suitImg.naturalWidth !== 0) {
                const sliderY = parseInt(posYSlider.value);
                const sliderScale = parseInt(scaleSlider.value) / 100;

                const suitW = canvas.width * 0.95 * sliderScale;
                const suitH = (suitImg.height / suitImg.width) * suitW;
                const suitX = (canvas.width - suitW) / 2;
                const suitY = (canvas.height - suitH) + 40 + sliderY; // Neckline anchoring

                ctx.drawImage(suitImg, suitX, suitY, suitW, suitH);
            }
        }

        function downloadPassportPhoto() {
            const link = document.createElement('a');
            link.download = 'mubashir-studio-id-safe.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        drawCanvas();
    </script>
</body>
</html>
