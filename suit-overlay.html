<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mubashir Photo Studio - Passport Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f11; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 600; }
        .btn-gold:hover { background: linear-gradient(135deg, #fde047 0%, #eab308 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-bold tracking-wide text-yellow-500">MUBASHIR PHOTO STUDIO</h1>
            </div>
            <span class="text-xs bg-green-500/10 text-green-400 border border-green-500/20 px-3 py-1 rounded-full font-medium">⚡ Instant Offline Studio Engine</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
                <h2 class="text-sm font-semibold text-yellow-500 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 1. Upload Photo
                </h2>
                <input type="file" id="userImgInput" accept="image/*" class="hidden">
                <label for="userImgInput" class="w-full btn-gold py-3 px-4 rounded-lg flex items-center justify-center gap-2 cursor-pointer shadow-lg">
                    <i class="fa-solid fa-image"></i> Select Customer Photo
                </label>
            </div>

            <!-- Background Color Selector -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-3">
                <h2 class="text-sm font-semibold text-yellow-500 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-palette"></i> 2. Background Color
                </h2>
                <div class="flex gap-3">
                    <button onclick="changeBg('#0044ff')" class="flex-1 py-2 rounded-lg bg-blue-600 text-xs font-semibold text-white border border-blue-400">Passport Blue</button>
                    <button onclick="changeBg('#ffffff')" class="flex-1 py-2 rounded-lg bg-white text-xs font-semibold text-black">Pure White</button>
                    <button onclick="changeBg('#ff0000')" class="flex-1 py-2 rounded-lg bg-red-600 text-xs font-semibold text-white">Red</button>
                </div>
            </div>

            <!-- Suit Position & Size Controls -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
                <h2 class="text-sm font-semibold text-yellow-500 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-shirt"></i> 3. Adjust Suit Overlay
                </h2>
                
                <div>
                    <label class="text-xs text-zinc-400 block mb-1">Suit Size (Zoom):</label>
                    <input type="range" id="suitScale" min="0.5" max="2" step="0.02" value="1" class="w-full accent-yellow-500" oninput="drawCanvas()">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-zinc-400 block mb-1">Move Up / Down:</label>
                        <input type="range" id="suitY" min="-150" max="150" step="1" value="0" class="w-full accent-yellow-500" oninput="drawCanvas()">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-1">Move Left / Right:</label>
                        <input type="range" id="suitX" min="-150" max="150" step="1" value="0" class="w-full accent-yellow-500" oninput="drawCanvas()">
                    </div>
                </div>
            </div>

            <button onclick="downloadPassportPhoto()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-base shadow-xl transition">
                <i class="fa-solid fa-download"></i> Download Passport Photo (35x45)
            </button>

        </div>

        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <div class="border-2 border-yellow-500/40 rounded-xl p-2 bg-zinc-900 shadow-2xl">
                <!-- 35mm x 45mm Aspect Ratio Canvas -->
                <canvas id="studioCanvas" width="413" height="531" class="rounded-lg bg-blue-600 max-w-full h-auto"></canvas>
            </div>
            <p class="text-xs text-zinc-500 mt-3"><i class="fa-solid fa-circle-info"></i> Standard Passport Size (35mm x 45mm @ 300 DPI)</p>
        </div>

    </main>

    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        © 2026 Mubashir Creative Hub & Photo Studio.
    </footer>

    <script>
        const canvas = document.getElementById('studioCanvas');
        const ctx = canvas.getContext('2d');
        
        let bgColor = '#0044ff';
        let userImg = null;
        let suitImg = new Image();
        
        // Transparent PNG 3-Piece Suit & Tie Template
        suitImg.src = 'https://i.ibb.co/68v81yM/suit-overlay.png';
        suitImg.onload = () => drawCanvas();

        document.getElementById('userImgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImg = new Image();
                    userImg.onload = () => drawCanvas();
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function changeBg(color) {
            bgColor = color;
            drawCanvas();
        }

        function drawCanvas() {
            // Fill Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Customer Photo
            if (userImg) {
                const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
                const x = (canvas.width / 2) - (userImg.width / 2) * scale;
                const y = (canvas.height / 2) - (userImg.height / 2) * scale;
                ctx.drawImage(userImg, x, y, userImg.width * scale, userImg.height * scale);
            }

            // Draw Suit Overlay
            if (suitImg.complete) {
                const scale = parseFloat(document.getElementById('suitScale').value);
                const offsetX = parseInt(document.getElementById('suitX').value);
                const offsetY = parseInt(document.getElementById('suitY').value);

                const suitWidth = canvas.width * scale;
                const suitHeight = (suitImg.height * (suitWidth / suitImg.width));
                
                const suitX = (canvas.width - suitWidth) / 2 + offsetX;
                const suitY = (canvas.height - suitHeight) + offsetY;

                ctx.drawImage(suitImg, suitX, suitY, suitWidth, suitHeight);
            }
        }

        function downloadPassportPhoto() {
            const link = document.createElement('a');
            link.download = 'mubashir-studio-passport.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initial Draw
        drawCanvas();
    </script>
</body>
</html>
