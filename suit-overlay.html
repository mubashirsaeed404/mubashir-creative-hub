<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Passport Suit Editor - Mubashir Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f11; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 600; }
        .btn-gold:hover { background: linear-gradient(135deg, #fde047 0%, #eab308 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-bold tracking-wide text-yellow-500">MUBASHIR PHOTO STUDIO</h1>
            </div>
            <span class="text-xs bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 px-3 py-1 rounded-full font-medium">👔 Passport Suit Studio</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-yellow-500"></i> 1. Upload Photo
                </h2>
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="w-full btn-gold py-3 px-4 rounded-lg flex items-center justify-center gap-2 cursor-pointer shadow-lg">
                    <i class="fa-solid fa-image"></i> Select Original Photo
                </label>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-tie text-yellow-500"></i> 2. Select Suit Style
                </h2>
                <div class="grid grid-cols-2 gap-3" id="suitGrid">
                    <div id="suit-0" onclick="selectSuit(0)" class="border-2 border-yellow-500 bg-zinc-800 p-3 rounded-lg cursor-pointer text-center">
                        <i class="fa-solid fa-user-tie text-3xl text-yellow-500 mb-1"></i>
                        <div class="text-xs font-semibold text-white">Black Suit & Red Tie</div>
                    </div>
                    <div id="suit-1" onclick="selectSuit(1)" class="border-2 border-zinc-700 bg-zinc-800 p-3 rounded-lg cursor-pointer text-center">
                        <i class="fa-solid fa-user-tie text-3xl text-blue-500 mb-1"></i>
                        <div class="text-xs font-semibold text-white">Navy Blue Suit</div>
                    </div>
                    <div id="suit-2" onclick="selectSuit(2)" class="border-2 border-zinc-700 bg-zinc-800 p-3 rounded-lg cursor-pointer text-center">
                        <i class="fa-solid fa-user-tie text-3xl text-gray-400 mb-1"></i>
                        <div class="text-xs font-semibold text-white">Dark Gray Suit</div>
                    </div>
                    <div id="suit-3" onclick="selectSuit(3)" class="border-2 border-zinc-700 bg-zinc-800 p-3 rounded-lg cursor-pointer text-center">
                        <i class="fa-solid fa-user-tie text-3xl text-zinc-300 mb-1"></i>
                        <div class="text-xs font-semibold text-white">Classic Black Coat</div>
                    </div>
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-yellow-500"></i> 3. Background Color
                </h2>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="changeBg('#ffffff')" class="p-3 border-2 border-zinc-700 bg-white rounded text-black text-xs font-bold">White</button>
                    <button onclick="changeBg('#0055ff')" class="p-3 border-2 border-zinc-700 bg-blue-600 rounded text-white text-xs font-bold">Blue</button>
                    <button onclick="changeBg('#a1a1aa')" class="p-3 border-2 border-zinc-700 bg-zinc-400 rounded text-black text-xs font-bold">Gray</button>
                    <button onclick="changeBg('#dc2626')" class="p-3 border-2 border-zinc-700 bg-red-600 rounded text-white text-xs font-bold">Red</button>
                </div>
            </div>

            <button onclick="downloadPassportPhoto()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-base shadow-xl transition">
                <i class="fa-solid fa-download"></i> Download HD Passport Photo
            </button>

        </div>

        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-2xl relative">
                <canvas id="studioCanvas" width="413" height="531" class="rounded max-w-full h-auto cursor-pointer"></canvas>
            </div>
            <div class="max-w-[413px] w-full mt-4 space-y-3">
                <div class="flex items-center gap-3">
                    <label class="text-xs text-zinc-400">Position Up/Down</label>
                    <input type="range" id="posYSlider" min="-150" max="150" value="0" class="flex-grow accent-yellow-500" oninput="drawCanvas()">
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-xs text-zinc-400">Suit Size</label>
                    <input type="range" id="scaleSlider" min="50" max="180" value="100" class="flex-grow accent-yellow-500" oninput="drawCanvas()">
                </div>
            </div>
        </div>

    </main>

    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        © 2026 Mubashir Creative Hub & Photo Studio. All Rights Reserved.
    </footer>

    <script>
        const canvas = document.getElementById('studioCanvas');
        const ctx = canvas.getContext('2d');
        const posYSlider = document.getElementById('posYSlider');
        const scaleSlider = document.getElementById('scaleSlider');

        let userImg = null;
        let selectedSuitIndex = 0;
        let bgColor = '#ffffff';

        // High Quality Built-in Vectors/Images
        const suitConfigs = [
            { coatColor: '#1a1a1a', tieColor: '#dc2626', shirtColor: '#ffffff' }, // Black & Red
            { coatColor: '#0f2b5c', tieColor: '#1d4ed8', shirtColor: '#ffffff' }, // Navy Blue
            { coatColor: '#374151', tieColor: '#111827', shirtColor: '#ffffff' }, // Dark Gray
            { coatColor: '#000000', tieColor: '#000000', shirtColor: '#ffffff' }  // Classic Black
        ];

        function selectSuit(index) {
            selectedSuitIndex = index;
            document.querySelectorAll('#suitGrid > div').forEach((d, i) => {
                if(i === index) {
                    d.classList.add('border-yellow-500');
                    d.classList.remove('border-zinc-700');
                } else {
                    d.classList.remove('border-yellow-500');
                    d.classList.add('border-zinc-700');
                }
            });
            drawCanvas();
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImg = new Image();
                    userImg.onload = () => drawCanvas();
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function changeBg(color) {
            bgColor = color;
            drawCanvas();
        }

        function drawCanvas() {
            // Fill Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw User Photo
            if (userImg) {
                const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
                const x = (canvas.width / 2) - (userImg.width / 2) * scale;
                const y = (canvas.height / 2) - (userImg.height / 2) * scale;
                ctx.drawImage(userImg, x, y, userImg.width * scale, userImg.height * scale);
            }

            // Render Vector Studio Suit Overlay
            drawVectorSuit();
        }

        function drawVectorSuit() {
            const config = suitConfigs[selectedSuitIndex];
            const sliderY = parseInt(posYSlider.value);
            const scale = parseInt(scaleSlider.value) / 100;

            const baseW = canvas.width * 1.1 * scale;
            const baseH = 260 * scale;
            const startX = (canvas.width - baseW) / 2;
            const startY = canvas.height - baseH + 30 + sliderY;

            ctx.save();

            // Shoulders & Suit Coat
            ctx.fillStyle = config.coatColor;
            ctx.beginPath();
            ctx.moveTo(startX, canvas.height);
            ctx.lineTo(startX + baseW * 0.15, startY + baseH * 0.2);
            ctx.lineTo(startX + baseW * 0.35, startY);
            ctx.lineTo(startX + baseW * 0.5, startY + baseH * 0.35); // V Neckline
            ctx.lineTo(startX + baseW * 0.65, startY);
            ctx.lineTo(startX + baseW * 0.85, startY + baseH * 0.2);
            ctx.lineTo(startX + baseW, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Shirt Collar Inner
            ctx.fillStyle = config.shirtColor;
            ctx.beginPath();
            ctx.moveTo(startX + baseW * 0.35, startY);
            ctx.lineTo(startX + baseW * 0.5, startY + baseH * 0.32);
            ctx.lineTo(startX + baseW * 0.65, startY);
            ctx.lineTo(startX + baseW * 0.5, startY + baseH * 0.12);
            ctx.closePath();
            ctx.fill();

            // Tie
            ctx.fillStyle = config.tieColor;
            ctx.beginPath();
            ctx.moveTo(startX + baseW * 0.47, startY + baseH * 0.12);
            ctx.lineTo(startX + baseW * 0.53, startY + baseH * 0.12);
            ctx.lineTo(startX + baseW * 0.54, startY + baseH * 0.35);
            ctx.lineTo(startX + baseW * 0.50, startY + baseH * 0.70);
            ctx.lineTo(startX + baseW * 0.46, startY + baseH * 0.35);
            ctx.closePath();
            ctx.fill();

            // Lapels (Coat Flaps)
            ctx.fillStyle = '#000000';
            ctx.globalAlpha = 0.25;
            ctx.beginPath();
            ctx.moveTo(startX + baseW * 0.35, startY);
            ctx.lineTo(startX + baseW * 0.28, startY + baseH * 0.25);
            ctx.lineTo(startX + baseW * 0.5, startY + baseH * 0.35);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(startX + baseW * 0.65, startY);
            ctx.lineTo(startX + baseW * 0.72, startY + baseH * 0.25);
            ctx.lineTo(startX + baseW * 0.5, startY + baseH * 0.35);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function downloadPassportPhoto() {
            const link = document.createElement('a');
            link.download = 'mubashir-studio-passport.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        drawCanvas();
    </script>
</body>
</html>
