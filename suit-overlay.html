<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo & Suit Editor - Mubashir Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f11; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 600; }
        .btn-gold:hover { background: linear-gradient(135deg, #fde047 0%, #eab308 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-bold tracking-wide text-yellow-500">MUBASHIR PHOTO STUDIO</h1>
            </div>
            <span class="text-xs bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 px-3 py-1 rounded-full font-medium">👔 Studio Passport Suit Editor</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Sidebar Controls -->
        <div class="lg:col-span-5 space-y-5">
            
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-yellow-500"></i> 1. Upload Photo
                </h2>
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="w-full btn-gold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 cursor-pointer shadow text-sm">
                    <i class="fa-solid fa-image"></i> Upload Original Photo
                </label>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-yellow-500"></i> 2. Background Color
                </h2>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="changeBg('#0055ff')" class="py-2 bg-blue-600 rounded text-xs text-white font-medium hover:opacity-90">Blue</button>
                    <button onclick="changeBg('#ffffff')" class="py-2 bg-white rounded text-xs text-black font-medium hover:opacity-90">White</button>
                    <button onclick="changeBg('#e5e7eb')" class="py-2 bg-gray-300 rounded text-xs text-black font-medium hover:opacity-90">Gray</button>
                    <button onclick="changeBg('#cc0000')" class="py-2 bg-red-600 rounded text-xs text-white font-medium hover:opacity-90">Red</button>
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-yellow-500"></i> 3. Adjust Suit Position
                </h2>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="text-zinc-400">Move Up / Down</label>
                        <input type="range" id="posY" min="-100" max="100" value="0" class="w-full accent-yellow-500" oninput="drawCanvas()">
                    </div>
                    <div>
                        <label class="text-zinc-400">Suit Size (Zoom)</label>
                        <input type="range" id="scale" min="50" max="150" value="100" class="w-full accent-yellow-500" oninput="drawCanvas()">
                    </div>
                </div>
            </div>

            <button onclick="downloadPassportPhoto()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2 text-base shadow-xl transition">
                <i class="fa-solid fa-download"></i> Download Passport Photo
            </button>

        </div>

        <!-- Canvas Preview -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <div class="bg-zinc-900 border-2 border-dashed border-zinc-700 rounded-xl p-3 shadow-2xl">
                <canvas id="passportCanvas" width="413" height="531" class="rounded bg-zinc-950 max-w-full h-auto"></canvas>
            </div>
            <p class="text-xs text-zinc-500 mt-3"><i class="fa-solid fa-circle-info"></i> Standard Passport Size 35mm x 45mm (300 DPI)</p>
        </div>

    </main>

    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        © 2026 Mubashir Creative Hub & Photo Studio. All Rights Reserved.
    </footer>

    <script>
        const canvas = document.getElementById('passportCanvas');
        const ctx = canvas.getContext('2d');

        let userImg = null;
        let suitImg = new Image();
        let bgColor = '#0055ff';

        // High quality transparent Suit PNG
        suitImg.src = 'https://images.rawpixel.com/image_png_800/2022/10/rawpixel-item-12002345-png.png';
        suitImg.crossOrigin = 'Anonymous';
        suitImg.onload = () => drawCanvas();

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImg = new Image();
                    userImg.onload = function() {
                        drawCanvas();
                    };
                    userImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function changeBg(color) {
            bgColor = color;
            drawCanvas();
        }

        function drawCanvas() {
            // Fill background color
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw user image if uploaded
            if (userImg) {
                const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
                const x = (canvas.width / 2) - (userImg.width / 2) * scale;
                const y = (canvas.height / 2) - (userImg.height / 2) * scale;
                ctx.drawImage(userImg, x, y, userImg.width * scale, userImg.height * scale);
            }

            // Draw Suit Overlay
            if (suitImg.complete && suitImg.naturalWidth !== 0) {
                const offsetY = parseInt(document.getElementById('posY').value);
                const suitScale = parseInt(document.getElementById('scale').value) / 100;

                const suitWidth = canvas.width * 0.95 * suitScale;
                const suitHeight = (suitImg.height / suitImg.width) * suitWidth;
                const suitX = (canvas.width - suitWidth) / 2;
                const suitY = canvas.height - suitHeight + 40 + offsetY;

                ctx.drawImage(suitImg, suitX, suitY, suitWidth, suitHeight);
            }
        }

        function downloadPassportPhoto() {
            const link = document.createElement('a');
            link.download = 'passport-photo-mubashir-studio.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initial draw
        drawCanvas();
    </script>
</body>
</html>
