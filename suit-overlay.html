<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Passport Photo & Suit Generator - Mubashir Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f11; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 600; }
        .btn-gold:hover { background: linear-gradient(135deg, #fde047 0%, #eab308 100%); }
        .loader { border-top-color: #eab308; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-zinc-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-bold tracking-wide text-yellow-500">MUBASHIR PHOTO STUDIO</h1>
            </div>
            <span class="text-xs bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 px-3 py-1 rounded-full font-medium">✨ AI Auto Suit Generator</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-yellow-500"></i> 1. Upload Photo
                </h2>
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="w-full btn-gold py-3 px-4 rounded-lg flex items-center justify-center gap-2 cursor-pointer shadow-lg">
                    <i class="fa-solid fa-image"></i> Select Original Photo
                </label>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-yellow-500"></i> 2. Passport Background
                </h2>
                <select id="bgSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-yellow-500">
                    <option value="Pure Official Blue">Official Blue Background</option>
                    <option value="Pure White">White Background</option>
                    <option value="Light Gray">Light Gray Background</option>
                    <option value="Official Red">Red Background</option>
                </select>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
                <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-tie text-yellow-500"></i> 3. Select Suit Style
                </h2>
                <select id="suitSelect" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg py-2.5 px-3 text-sm focus:outline-none focus:border-yellow-500">
                    <option value="a dark blue three-piece formal suit with a matching tie">Dark Blue Three-Piece Suit & Tie</option>
                    <option value="a professional black coat with a red tie and crisp white shirt">Black Suit & Red Tie</option>
                    <option value="a classic dark gray executive business suit with tie">Dark Gray Business Suit</option>
                </select>
            </div>

            <button id="generateBtn" onclick="generateAISuit()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 text-base shadow-xl transition">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate AI Passport Photo
            </button>

        </div>

        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <div class="w-full max-w-[420px] aspect-[3/4] bg-zinc-900 border-2 border-dashed border-zinc-700 rounded-xl flex flex-col items-center justify-center relative overflow-hidden shadow-2xl p-2">
                <div id="loadingState" class="hidden absolute inset-0 bg-zinc-950/90 z-20 flex flex-col items-center justify-center space-y-4">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-zinc-700 h-12 w-12"></div>
                    <p class="text-sm font-medium text-yellow-500">Generating AI Photo... Please wait</p>
                </div>
                <img id="previewImg" class="w-full h-full object-cover rounded-lg hidden" alt="Passport Result">
                <div id="placeholderText" class="text-center p-6 text-zinc-500">
                    <i class="fa-solid fa-id-badge text-5xl mb-3 text-zinc-700"></i>
                    <p class="text-sm">Upload photo and click generate to process with AI</p>
                </div>
            </div>

            <div class="w-full max-w-[420px] mt-4">
                <a id="downloadBtn" download="passport-ai-photo.png" class="hidden w-full btn-gold py-3 px-6 rounded-xl flex items-center justify-center gap-2 text-sm shadow-xl">
                    <i class="fa-solid fa-download"></i> Download HD Passport Photo
                </a>
            </div>
        </div>

    </main>

    <footer class="border-t border-zinc-800 py-4 text-center text-xs text-zinc-500">
        © 2026 Mubashir Creative Hub & Photo Studio. All Rights Reserved.
    </footer>

    <script>
        const API_KEY = "YOUR_GEMINI_API_KEY_HERE";

        let base64Image = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result.split(',')[1];
                    const preview = document.getElementById('previewImg');
                    preview.src = event.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('placeholderText').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        async function generateAISuit() {
            if (!base64Image) {
                alert("Please upload a photo first!");
                return;
            }

            const bgStyle = document.getElementById('bgSelect').value;
            const suitStyle = document.getElementById('suitSelect').value;

            const promptText = `Keep the uploaded photo exactly in its original state without changing the person's identity or face shape. Transform it into a passport size photo with dimensions of 35mm width x 45mm height, 4K resolution. Set the background to ${bgStyle}. Dress the person in ${suitStyle}. Adjust the hairstyle to suit the face seamlessly. The final photo must look authentic, realistic, and official passport size. Face and hairstyle 100% Reference. Do not change face and hairstyle.`;

            document.getElementById('loadingState').classList.remove('hidden');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }],
                        generationConfig: {
                            response_mime_type: "image/jpeg"
                        }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].inline_data) {
                    const resultBase64 = data.candidates[0].content.parts[0].inline_data.data;
                    const resultUrl = `data:image/jpeg;base64,${resultBase64}`;
                    
                    const preview = document.getElementById('previewImg');
                    preview.src = resultUrl;

                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.href = resultUrl;
                    downloadBtn.classList.remove('hidden');
                } else {
                    alert("AI image generation response received. If image is not rendering, verify your Gemini API model permissions.");
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to Gemini API. Please check your API key.");
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
